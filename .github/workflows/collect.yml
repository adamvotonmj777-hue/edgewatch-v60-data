name: EdgeWatch v6 stateless market collection

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgewatch-v60-stateless-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect one public read-only snapshot
        run: python artifact_snapshot.py --output artifact
      - name: Retain the independent snapshot for seven days
        uses: actions/upload-artifact@v4
        with:
          name: edgewatch-v60-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifact/snapshot_*.json.gz
            artifact/run_manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
